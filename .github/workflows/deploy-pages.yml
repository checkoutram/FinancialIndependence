name: Deploy to GitHub Pages

concurrency:
  group: pages
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Web app is intentionally NOT published — only the privacy policy page
      # (required by the Play Store listing) is kept online.
      - name: Prepare privacy-only site
        run: |
          mkdir -p site
          cp public/privacy.html site/privacy.html
          echo '<!doctype html><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.checkoutram.finplan"><title>FIRE Tracker</title><p>Get FIRE Tracker on <a href="https://play.google.com/store/apps/details?id=com.checkoutram.finplan">Google Play</a>.</p>' > site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
