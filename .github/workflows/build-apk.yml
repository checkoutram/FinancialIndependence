name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Update npm (Node 22 runner npm bug workaround)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Decode upload keystore
        run: echo "${{ secrets.FIRE_KEYSTORE_BASE64 }}" | base64 -d > android/app/fire-upload.keystore

      - name: Build signed release APK + AAB
        working-directory: android
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          FIRE_KEYSTORE_FILE: fire-upload.keystore
          FIRE_KEY_ALIAS: ${{ secrets.FIRE_KEY_ALIAS }}
          FIRE_KEYSTORE_PASSWORD: ${{ secrets.FIRE_KEYSTORE_PASSWORD }}
          FIRE_KEY_PASSWORD: ${{ secrets.FIRE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: finplan-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload signed AAB (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: finplan-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
